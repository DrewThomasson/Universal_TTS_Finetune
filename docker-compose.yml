services:
  universal-tts:
    build:
      context: .
      args:
        UFT_UID: "${UFT_UID:-1000}"
        UFT_GID: "${UFT_GID:-1000}"
    user: "${UFT_UID:-1000}:${UFT_GID:-1000}"
    ports:
      - "7862:7862"
    volumes:
      - ./models:/app/models
      - ./finetune_models:/app/finetune_models
      # Mount your audio inputs here to access them in the container
      - ./audio_data:/app/audio_data
    # Enable GPU support if you have an NVIDIA GPU and nvidia-container-toolkit installed
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
